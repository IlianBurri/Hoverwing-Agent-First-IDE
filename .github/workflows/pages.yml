name: Website

# Publishes site/ (plus the README screenshots and the app icon) to GitHub
# Pages. Enable once: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [claude/kestrel-agent-ide-spec-k43ixk]
    paths:
      - site/**
      - docs/images/**
      - apps/desktop/build/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.png _site/images/
          cp apps/desktop/build/icon.png _site/images/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
