name: Release

# Builds the installers for Windows (.exe), macOS (.dmg) and Linux (.AppImage).
# - Push a tag like v0.8.1: all installers and the update feed (latest*.yml)
#   are attached to a GitHub release; installed apps find the update there.
# - "Run workflow" in the Actions tab: installers are kept as build artifacts
#   (downloadable from the run page for 30 days).
#
# Code signing is optional.
#   Windows (free for open source, see docs/code-signing.md): SignPath
#     Foundation. Turns on when the repository variable SIGNPATH_ORGANIZATION_ID
#     and the secret SIGNPATH_API_TOKEN exist (optional variables:
#     SIGNPATH_PROJECT_SLUG, default "kestrel"). Tags use the signing policy
#     "release-signing" (approved by hand in SignPath), manual runs
#     "test-signing".
#     Alternatively, with an own certificate: WIN_CSC_LINK (base64 .pfx),
#     WIN_CSC_KEY_PASSWORD.
#   macOS: MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD,
#          APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # SignPath reads the job details to verify where the artifact was built.
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SIGNING_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
        working-directory: .

      - name: Build the installer
        if: env.SIGNPATH != 'true'
        run: pnpm package:win
        env:
          # Without a certificate electron-builder builds unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # SignPath: sign Hoverwing.exe first, build the installer around the signed
      # app (--prepackaged leaves the exe untouched), sign the installer, then
      # recompute the update feed, which signing invalidated.
      - name: Build the app (unsigned)
        if: env.SIGNPATH == 'true'
        id: version
        shell: bash
        run: |
          pnpm build
          pnpm exec electron-builder --win dir --publish never
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload the app for signing
        if: env.SIGNPATH == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: apps/desktop/release/win-unpacked
          retention-days: 1
      - name: Remove the unsigned app
        if: env.SIGNPATH == 'true'
        shell: bash
        run: rm -rf release/win-unpacked
      - name: Sign the app
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kestrel' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/win-unpacked
      - name: Build the installer around the signed app
        if: env.SIGNPATH == 'true'
        run: pnpm exec electron-builder --win nsis --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload the installer for signing
        if: env.SIGNPATH == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: apps/desktop/release/Hoverwing-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 1
      - name: Sign the installer
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kestrel' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/signed
      - name: Update the feed for the signed installer
        if: env.SIGNPATH == 'true'
        shell: bash
        run: |
          file="Hoverwing-Setup-${{ steps.version.outputs.version }}.exe"
          mv -f "release/signed/$file" "release/$file"
          node scripts/update-win-feed.mjs "release/$file"
      - name: Check the signatures
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          foreach ($file in @('release/win-unpacked/Hoverwing.exe', "release/Hoverwing-Setup-${{ steps.version.outputs.version }}.exe")) {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file : $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$file is not signed" }
          }

      - name: Smoke test the packaged app
        run: pnpm exec playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: Hoverwing-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.dmg.blockmap
              apps/desktop/release/latest-mac.yml
          # node-pty is compiled during install and needs at least the glibc
          # of the build machine: build on the oldest supported Ubuntu, so the
          # AppImage also starts on older systems (ubuntu-latest made 0.9.0
          # need glibc 2.42, which crashed on Ubuntu 24.04).
          - os: ubuntu-22.04
            script: package:linux
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm restores node-pty already compiled from its cache, which may come
      # from a newer runner: compile it again on this machine.
      - name: Compile node-pty on this runner
        if: runner.os == 'Linux'
        run: pnpm --filter @kestrel/desktop rebuild node-pty
      - run: pnpm typecheck
      - name: Build the installer
        # A missing secret arrives as an empty CSC_LINK, which electron-builder
        # resolves to the working directory ("not a file"): unset it instead.
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          pnpm --filter @kestrel/desktop ${{ matrix.script }}
        env:
          # Without a certificate electron-builder builds unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check the glibc the native modules need
        if: runner.os == 'Linux'
        working-directory: apps/desktop/release/linux-unpacked
        run: |
          max=2.35
          need=$(find . -name '*.node' -path '*linux*' -o -name '*.node' -path '*build/Release*' \
            | xargs -r objdump -T | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "native modules need glibc $need (allowed: $max)"
          [ "$(printf '%s\n%s\n' "$need" "$max" | sort -V | tail -1)" = "$max" ]
      - uses: actions/upload-artifact@v4
        with:
          name: Hoverwing-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, build]
    runs-on: ubuntu-latest
    steps:
      # Only for docs/releases/<tag>.md (the release notes).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Hoverwing-*
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          ls -la dist
          if [ "$SIGNED" = "true" ]; then
            windows='SmartScreen may still warn for new releases: *More info* → *Run anyway*.'
          else
            windows='Not code-signed: SmartScreen may say “Windows protected your PC” → *More info* → *Run anyway*.'
          fi
          {
            # What's new, written by hand per release (optional).
            if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
              cat "docs/releases/$GITHUB_REF_NAME.md"
            fi
            cat <<'NOTES'
          ## Download

          | System | File |
          | --- | --- |
          | Windows 10/11 (x64) | `Hoverwing-Setup-<version>.exe` |
          | macOS (Apple Silicon) | `Hoverwing-<version>-arm64.dmg` |
          | Linux (x64) | `Hoverwing-<version>-x86_64.AppImage` |

          First start:
          NOTES
            echo "- **Windows:** $windows"
            cat <<'NOTES'
          - **macOS** (not notarized): open the app once, then *System Settings → Privacy & Security → Open Anyway* (on macOS 14 and older: right-click the app → *Open*).
          - **Linux:** `chmod +x Hoverwing-*.AppImage`, then start it.

          Installed apps (Windows, Linux) find new versions here and offer to update.

          [Code signing policy](https://github.com/IlianBurri/Kestrel-Agen-Harness-IDE#code-signing-policy) · [Privacy](https://github.com/IlianBurri/Kestrel-Agen-Harness-IDE/blob/HEAD/PRIVACY.md)
          NOTES
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Hoverwing $GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
