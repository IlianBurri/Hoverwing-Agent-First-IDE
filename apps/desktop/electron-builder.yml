appId: dev.kestrel.app
productName: Kestrel
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Native binaries cannot run from inside the asar archive.
asarUnpack:
  - '**/node_modules/@vscode/ripgrep-*/**'
  - '**/node_modules/@parcel/watcher-*/**'
mac:
  category: public.app-category.developer-tools
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
  category: Development
